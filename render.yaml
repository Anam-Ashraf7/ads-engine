# Render web service: one server for both the dashboard and the Google Ads API behind it.
# Settings holding secrets are added by hand on Render and never committed. See README.md, "Hosting on Render".
# Free is fine in test mode. Live mode needs a paid instance: free ones sleep after 15 minutes and the spending cap stops running.
services:
  - type: web
    name: ads-engine
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/gads-server.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AE_ENV_FILE
        value: /etc/secrets/server.env
      - key: AE_LOGIN_PASSWORD
        sync: false
      - key: AE_SESSION_SECRET
        generateValue: true
